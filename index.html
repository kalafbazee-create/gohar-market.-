<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#176b52">
<link rel="manifest" href="manifest.webmanifest">
<title>گهر مارکت</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f4;color:#17231e;font-family:Tahoma,Arial,sans-serif}
header{background:#176b52;color:white;padding:18px;text-align:center}
header h1{margin:0 0 6px;font-size:23px}
main{max-width:760px;margin:auto;padding:14px}
.card{background:white;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 2px 9px #0000000d}
h2{font-size:18px;margin:0 0 12px}
label{display:block;font-size:14px;margin:9px 0 5px}
input{width:100%;padding:12px;border:1px solid #ccd6d0;border-radius:9px;font-size:16px}
button{border:0;border-radius:9px;padding:11px 14px;background:#176b52;color:white;font-size:15px;margin:5px 3px;cursor:pointer}
button.secondary{background:#e6efea;color:#174d3c}
button.danger{background:#a93434}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>*{flex:1;min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 5px;border-bottom:1px solid #e6ece8;text-align:right;vertical-align:middle}
.small{font-size:13px;color:#52645a}
.total{font-weight:bold;font-size:20px;margin:12px 0}
#scanner{
  display:none;
  position:fixed !important;
  top:8px !important;
  left:8px !important;
  right:8px !important;
  width:auto !important;
  max-width:760px;
  max-height:45vh;
  overflow-y:auto;
  margin:0 auto !important;
  z-index:2147483647 !important;
  background:#fff;
  box-shadow:0 6px 24px rgba(0,0,0,.35);
}

#scanner video{width:100%;max-height:160px;object-fit:cover}
video{width:100%;max-height:320px;background:#111;border-radius:10px;object-fit:cover}
.product-found{background:#eef7f1;border:1px solid #c9e4d3;border-radius:10px;padding:12px;margin-top:12px}
.product-found strong{font-size:16px}
.pill{display:inline-block;background:#e6efea;border-radius:20px;padding:4px 9px;font-size:12px;margin:3px}
.empty{color:#66756c;text-align:center;padding:12px}
.actions{white-space:nowrap}
@media(max-width:480px){table{font-size:12px}td,th{padding:7px 3px}button{font-size:14px;padding:10px}}
</style>
</head>
<body>
<header><h1>گهر مارکت</h1><div>مدیریت کالا و فروش</div></header>
<nav class="row" style="max-width:760px;margin:12px auto 0;padding:0 14px">
<button id="tabProducts" onclick="showPage('productsPage')">مدیریت محصولات</button>
<button id="tabInvoice" class="secondary" onclick="showPage('invoicePage')">صدور فاکتور</button>
</nav>
<main>
<div id="scanner" class="card" style="display:none">
<video id="video" playsinline muted></video>
<div id="status" class="small">کد را مقابل دوربین بگیرید.</div>
<button class="secondary" onclick="stopScan()">بستن دوربین</button>
</div>
<div id="productsPage">
<section class="card">
<h2>افزودن یا ویرایش کالا</h2>
<label>بارکد یا شناسه کالا</label>
<div class="row">
<input id="barcode" placeholder="بارکد را وارد یا اسکن کنید">
<button onclick="startScan('product')">اسکن QR و بارکد</button>
</div>

<label>نام کالا</label><input id="name" placeholder="مثلاً نوشابه">
<div class="row">
<div><label>قیمت فروش (تومان)</label><input id="price" type="number" min="0"></div>
<div><label>موجودی</label><input id="stock" type="number" min="0"></div>
</div>
<button onclick="saveProduct()">ذخیره کالا</button>
</section>

<section class="card">
<h2>فهرست کالاها</h2>
<div id="products"></div>
</section>
</div>

<div id="invoicePage" style="display:none">
<section class="card">
<h2>صدور فاکتور</h2>
<label>اسکن یا وارد کردن بارکد کالا</label>
<div class="row">
<input id="saleBarcode" placeholder="بارکد کالا">
<button onclick="startScan('sale')">اسکن برای جست‌وجوی کالا</button>
</div>
<div id="foundProduct"></div>
<div class="row">
<div><label>تعداد</label><input id="qty" type="number" min="1" value="1"></div>
<div style="align-self:end"><button onclick="findSaleProduct()">جست‌وجوی کالا</button></div>
</div>
<div id="cart"></div>
<div class="total" id="sum">جمع کل: ۰ تومان</div>
<button onclick="checkout()">ثبت نهایی فروش</button>
<button class="secondary" onclick="printInvoice()">چاپ فاکتور</button>
</section>

</div>

<section class="card">
<h2>پشتیبان‌گیری و بازیابی</h2>
<button class="secondary" onclick="backup()">دانلود پشتیبان اطلاعات</button>
<label>بازیابی فایل پشتیبان</label>
<input type="file" id="restoreFile" accept="application/json" onchange="restore(event)">
<p class="small">اطلاعات روی همین مرورگر و همین دستگاه ذخیره می‌شود.</p>
</section>
</main>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString('fa-IR');
let products=JSON.parse(localStorage.getItem('ghermarket_products')||'[]');
let cart=[],codeReader=null,scanMode='sale',selectedProduct=null,lastScannedCode='',lastScannedAt=0;

function persist(){
  localStorage.setItem('ghermarket_products',JSON.stringify(products));
  renderProducts();
}
function saveProduct(){
  const barcode=$('barcode').value.trim(),name=$('name').value.trim();
  const price=Number($('price').value),stock=Number($('stock').value);
  if(!barcode||!name){alert('بارکد و نام کالا را وارد کنید.');return}
  if(price<0||stock<0||!Number.isFinite(price)||!Number.isFinite(stock)){alert('قیمت و موجودی معتبر وارد کنید.');return}
  let p=products.find(x=>String(x.barcode)===barcode);
  if(p){p.name=name;p.price=price;p.stock=stock}
  else products.push({barcode,name,price,stock});
  persist();alert('کالا ذخیره شد.');
  $('barcode').value=$('name').value=$('price').value=$('stock').value='';
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderProducts(){
  if(!products.length){$('products').innerHTML='<p class="empty">هنوز کالایی ثبت نشده است.</p>';return}
  $('products').innerHTML='<table><tr><th>نام</th><th>بارکد</th><th>قیمت</th><th>موجودی</th><th></th></tr>'+
    products.map((p,i)=>`<tr><td>${esc(p.name)}</td><td>${esc(p.barcode)}</td><td>${fmt(p.price)}</td><td>${fmt(p.stock)}</td><td><button class="secondary" onclick="editProduct(${i})">ویرایش</button></td></tr>`).join('')+'</table>';
}
function editProduct(i){
  const p=products[i];$('barcode').value=p.barcode;$('name').value=p.name;
  $('price').value=p.price;$('stock').value=p.stock;
  window.scrollTo({top:0,behavior:'smooth'});
}
function findSaleProduct(){
  const code=$('saleBarcode').value.trim();
  if(!code){alert('بارکد را وارد یا اسکن کنید.');return}
  const p=products.find(x=>String(x.barcode)===code);
  if(!p){
    selectedProduct=null;
    $('foundProduct').innerHTML='<div class="product-found">کالایی با این کد پیدا نشد. ابتدا آن را در بخش «افزودن کالا» ثبت کنید.</div>';
    return;
  }
  selectedProduct=p;
  $('foundProduct').innerHTML=`<div class="product-found">
    <strong>${esc(p.name)}</strong><br>
    <span class="pill">قیمت: ${fmt(p.price)} تومان</span>
    <span class="pill">موجودی: ${fmt(p.stock)}</span>
    <div class="small">کد کالا: ${esc(p.barcode)}</div>
    <button onclick="addSelectedToCart()">افزودن به فاکتور</button>
  </div>`;
}
function addScannedProductToCart(code){
  const p=products.find(x=>String(x.barcode)===String(code));
  if(!p){
    selectedProduct=null;
    $('foundProduct').innerHTML='<div class="product-found">این بارکد در فهرست کالاها ثبت نشده است.</div>';
    return 'missing';
  }
  const item=cart.find(x=>String(x.barcode)===String(p.barcode));
  const already=item?item.qty:0;
  if(already+1>Number(p.stock||0)) return 'stock';
  if(item)item.qty+=1;
  else cart.push({barcode:p.barcode,name:p.name,price:Number(p.price)||0,qty:1});
  renderCart();
  $('saleBarcode').value='';
  $('qty').value='1';
  $('foundProduct').innerHTML='';
  selectedProduct=null;
  return 'added';
}
function addSelectedToCart(){
  if(!selectedProduct){findSaleProduct();return}
  const p=products.find(x=>String(x.barcode)===String(selectedProduct.barcode));
  if(!p){alert('این کالا در فهرست پیدا نشد.');return}
  const q=Math.max(1,Math.floor(Number($('qty').value)||1));
  const item=cart.find(x=>String(x.barcode)===String(p.barcode));
  const already=item?item.qty:0;
  if(already+q>p.stock){alert('موجودی کافی نیست. موجودی باقی‌مانده: '+fmt(Math.max(0,p.stock-already)));return}
  if(item)item.qty+=q;
  else cart.push({barcode:p.barcode,name:p.name,price:Number(p.price)||0,qty:q});
  renderCart();
  $('saleBarcode').value='';$('qty').value='1';$('foundProduct').innerHTML='';
  selectedProduct=null;
  if($('scanner').style.display!=='none') $('status').textContent='کالا به فاکتور اضافه شد؛ بارکد کالای بعدی را اسکن کنید.';
}
function playBeep(){
  try{
    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtx)return;
    const ctx=new AudioCtx(),osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type='sine';osc.frequency.value=880;
    gain.gain.setValueAtTime(0.0001,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.18,ctx.currentTime+0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.16);
    osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.17);
    osc.onended=()=>ctx.close();
  }catch(e){}
}
async function startScan(mode='sale'){
  if(codeReader){stopScan()}
  scanMode=mode;lastScannedCode='';lastScannedAt=0;
  if(!window.ZXing||!ZXing.BrowserMultiFormatReader){
    alert('کتابخانه اسکن بارگذاری نشد. اینترنت گوشی را بررسی کنید و دوباره تلاش کنید.');return;
  }
  $('scanner').style.display='block';
  $('status').textContent='در حال باز کردن دوربین...';
  try{
    const formats=[
      ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,
      ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E,ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.ITF,ZXing.BarcodeFormat.CODABAR
    ];
    const hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER,false);
    codeReader=new ZXing.BrowserMultiFormatReader(hints,160);
    await codeReader.decodeFromVideoDevice(undefined,$('video'),(result,error)=>{
      if(!result)return;
      const value=String(result.getText()||'').trim();
      if(!value)return;
      const now=Date.now();
      if(value===lastScannedCode && now-lastScannedAt<1600)return;
      lastScannedCode=value;lastScannedAt=now;
      playBeep();
      if(scanMode==='product'){
        $('barcode').value=value;
        const existing=products.find(x=>String(x.barcode)===value);
        if(existing){
          $('name').value=existing.name;$('price').value=existing.price;$('stock').value=existing.stock;
          $('status').textContent='دینگ! کالای ثبت‌شده پیدا شد: '+existing.name+'؛ برای اسکن بعدی بارکد دیگری روبه‌روی دوربین بگیرید.';
        }else{
          $('name').value='';
          $('status').textContent='دینگ! کد خوانده شد؛ نام، قیمت و موجودی را وارد و ذخیره کنید. برای اسکن بعدی دوربین باز می‌ماند.';
        }
      }else{
        $('saleBarcode').value=value;
        const result=addScannedProductToCart(value);
        if(result==='added'){
          $('status').textContent='✓ کالا خودکار به فاکتور اضافه شد؛ بارکد بعدی را اسکن کنید.';
        }else if(result==='stock'){
          $('status').textContent='موجودی این کالا کافی نیست.';
        }else{
          $('status').textContent='این بارکد ثبت نشده است؛ ابتدا کالا را در مدیریت محصولات اضافه کنید.';
        }
      }
    });
    $('status').textContent='دوربین آماده است؛ QR یا بارکد را مقابل دوربین بگیرید.';
  }catch(e){
    $('status').textContent='اسکن شروع نشد: '+(e.message||e);
    stopScan();
  }
}
function stopScan(){
  if(codeReader){try{codeReader.reset()}catch(e){}codeReader=null}
  $('scanner').style.display='none';
}
function renderCart(){
  if(!cart.length)$('cart').innerHTML='<p class="empty">هنوز کالایی به فاکتور اضافه نشده است.</p>';
  else $('cart').innerHTML='<table><tr><th>کالا</th><th>تعداد</th><th>قیمت واحد</th><th>مبلغ</th><th></th></tr>'+
    cart.map((x,i)=>`<tr><td>${esc(x.name)}<div class="small">${esc(x.barcode)}</div></td><td>${fmt(x.qty)}</td><td>${fmt(x.price)}</td><td>${fmt(x.price*x.qty)}</td><td class="actions"><button class="danger" onclick="removeCartItem(${i})">حذف</button></td></tr>`).join('')+'</table>';
  $('sum').textContent='جمع کل: '+fmt(cart.reduce((s,x)=>s+x.price*x.qty,0))+' تومان';
}
function removeCartItem(i){cart.splice(i,1);renderCart()}
function checkout(){
  if(!cart.length){alert('فاکتور خالی است.');return}
  for(const x of cart){
    const p=products.find(p=>String(p.barcode)===String(x.barcode));
    if(!p||p.stock<x.qty){alert('موجودی کالای '+x.name+' کافی نیست. فاکتور ثبت نشد.');return}
  }
  const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
  cart.forEach(x=>{const p=products.find(p=>String(p.barcode)===String(x.barcode));p.stock-=x.qty});
  persist();alert('فروش ثبت شد. مبلغ کل: '+fmt(total)+' تومان');
  cart=[];renderCart();$('foundProduct').innerHTML='';
}
function printInvoice(){
  if(!cart.length){alert('فاکتور خالی است.');return}
  const w=window.open('','_blank');
  if(!w){alert('اجازه باز شدن پنجره چاپ را در مرورگر فعال کنید.');return}
  w.document.write('<meta charset="utf-8"><div dir="rtl" style="font-family:Tahoma;padding:20px"><h2>گهر مارکت</h2><table border="1" cellpadding="8" style="border-collapse:collapse;width:100%"><tr><th>کالا</th><th>تعداد</th><th>قیمت واحد</th><th>مبلغ</th></tr>'+
    cart.map(x=>`<tr><td>${esc(x.name)}</td><td>${fmt(x.qty)}</td><td>${fmt(x.price)}</td><td>${fmt(x.price*x.qty)}</td></tr>`).join('')+
    '</table><h3>جمع کل: '+fmt(cart.reduce((s,x)=>s+x.price*x.qty,0))+' تومان</h3></div>');
  w.document.close();w.focus();w.print();
}
function backup(){
  const blob=new Blob([JSON.stringify(products,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ghermarket-backup.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function restore(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;products=d;persist();alert('پشتیبان بازیابی شد.')}
    catch(_){alert('فایل پشتیبان معتبر نیست.')}
  };
  r.readAsText(f);
}
function showPage(id){
  $('productsPage').style.display=id==='productsPage'?'block':'none';
  $('invoicePage').style.display=id==='invoicePage'?'block':'none';
  $('tabProducts').className=id==='productsPage'?'':'secondary';
  $('tabInvoice').className=id==='invoicePage'?'':'secondary';
  stopScan();
  window.scrollTo({top:0,behavior:'smooth'});
}
// Keep the scanner outside the scrolling page content so fixed positioning
// is relative to the viewport on mobile browsers.
document.body.appendChild($('scanner'));
renderProducts();renderCart();showPage('productsPage');
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
